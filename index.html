<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flashcard Trainer</title>
<style>
:root {
  --bg: #FFF8F0;
  --card-back: #3A5A8C;
  --accent1: #FF6B6B;
  --accent2: #FFD166;
  --accent3: #06D6A0;
  --accent4: #118AB2;
  --shadow: 0 8px 32px rgba(58, 90, 140, 0.18);
  --radius: 24px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  text-align: center;
}
h1 { font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--card-back); margin-bottom: 8px; }
h1 span { color: var(--accent1); }
.subtitle { color: #6B7C93; font-size: 1rem; margin-bottom: 40px; }
.lang-grid {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 480px;
  width: 100%;
}
.lang-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  padding: 28px 32px;
  background: white;
  border: 3px solid rgba(58,90,140,0.1);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  font-family: inherit;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  min-width: 130px;
  -webkit-tap-highlight-color: transparent;
}
.lang-btn:hover { transform: translateY(-3px); box-shadow: 0 14px 40px rgba(58,90,140,0.22); border-color: var(--card-back); }
.lang-btn:active { transform: translateY(0); }
.lang-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.lang-btn .flag { font-size: 3rem; line-height: 1; }
.lang-btn .name { font-size: 1.1rem; font-weight: 700; color: var(--card-back); }
.lang-btn .count { font-size: 0.75rem; color: #B0BFCF; font-weight: 600; letter-spacing: 0.04em; }
.status { margin-top: 28px; font-size: 0.9rem; color: #6B7C93; min-height: 22px; }
.status.error { color: var(--accent1); font-weight: 600; }
.current-deck {
  margin-top: 24px;
  background: white;
  border: 2px solid rgba(58,90,140,0.12);
  border-radius: 14px;
  padding: 14px 22px;
  font-size: 0.88rem;
  color: #6B7C93;
  max-width: 320px;
}
.current-deck strong { color: var(--card-back); }
.current-deck a { color: var(--accent4); font-weight: 700; text-decoration: none; margin-left: 6px; }
.current-deck a:hover { text-decoration: underline; }

/* UI language selector */
.ui-lang-select {
  position: fixed;
  top: 14px;
  right: 14px;
  padding: 5px 10px;
  border-radius: 20px;
  border: 1.5px solid rgba(58,90,140,0.2);
  background: white;
  font-family: inherit;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--card-back);
  cursor: pointer;
  outline: none;
  box-shadow: 0 2px 8px rgba(58,90,140,0.08);
}
.ui-lang-select:focus { border-color: var(--card-back); }
</style>
</head>
<body>

<select class="ui-lang-select" id="uiLangSelect">
  <option value="en">🇬🇧 EN</option>
  <option value="fr">🇫🇷 FR</option>
  <option value="nl">🇳🇱 NL</option>
</select>

<h1>🎴 Flashcard <span>Trainer</span></h1>
<p class="subtitle" id="subtitle">Choose a language to study:</p>

<div class="lang-grid">
  <button class="lang-btn" id="btn-fr" onclick="loadDeck('fr')">
    <span class="flag">🇫🇷</span>
    <span class="name" id="fr-name">French</span>
    <span class="count" id="fr-count">…</span>
  </button>
  <button class="lang-btn" id="btn-nl" onclick="loadDeck('nl')">
    <span class="flag">🇳🇱</span>
    <span class="name" id="nl-name">Dutch</span>
    <span class="count" id="nl-count">…</span>
  </button>
</div>

<div class="status" id="status"></div>
<div id="currentDeckBox"></div>

<script>
(function() {
  'use strict';

  // --- i18n ---
  var STRINGS = {
    en: {
      title: 'Flashcard Trainer',
      subtitle: 'Choose a language to study:',
      currentlyLoaded: 'Currently loaded:',
      continuePlaying: '▶ Continue playing',
      loading: 'Loading\u2026',
      cards: 'cards',
      errorMsg: 'Could not load — make sure you are using a web server, not file://',
      langFr: 'French', langNl: 'Dutch'
    },
    fr: {
      title: 'Entraîneur de Cartes',
      subtitle: 'Choisissez une langue à étudier\u00a0:',
      currentlyLoaded: 'Actuellement chargé\u00a0:',
      continuePlaying: '▶ Continuer à jouer',
      loading: 'Chargement\u2026',
      cards: 'cartes',
      errorMsg: 'Impossible de charger — utilisez un serveur web, pas file://',
      langFr: 'Français', langNl: 'Néerlandais'
    },
    nl: {
      title: 'Flitskaarten Trainer',
      subtitle: 'Kies een taal om te oefenen:',
      currentlyLoaded: 'Momenteel geladen:',
      continuePlaying: '▶ Doorgaan',
      loading: 'Laden\u2026',
      cards: 'kaarten',
      errorMsg: 'Kon niet laden — gebruik een webserver, niet file://',
      langFr: 'Frans', langNl: 'Nederlands'
    }
  };

  var uiLang = localStorage.getItem('ui_lang') || 'en';

  function t(key) {
    return (STRINGS[uiLang] || STRINGS.en)[key] || key;
  }

  function applyUiLang() {
    document.getElementById('subtitle').textContent = t('subtitle');
    document.title = t('title');
    document.getElementById('fr-name').textContent = t('langFr');
    document.getElementById('nl-name').textContent = t('langNl');
    renderCount('fr');
    renderCount('nl');
    renderCurrentDeck();
  }

  // Set the dropdown to match stored lang
  var sel = document.getElementById('uiLangSelect');
  sel.value = uiLang;
  sel.onchange = function() {
    uiLang = this.value;
    localStorage.setItem('ui_lang', uiLang);
    applyUiLang();
  };

  // Show count on buttons once JSON is fetched
  var fetchedCounts = {};

  function renderCount(lang) {
    var el = document.getElementById(lang + '-count');
    if (el && fetchedCounts[lang] !== undefined) {
      el.textContent = fetchedCounts[lang] + ' ' + t('cards');
    }
  }

  function fetchCount(lang) {
    fetch('data/' + lang + '.json')
      .then(function(r) { return r.json(); })
      .then(function(d) {
        fetchedCounts[lang] = d.cards.length;
        renderCount(lang);
      })
      .catch(function() {
        var el = document.getElementById(lang + '-count');
        if (el) el.textContent = '';
      });
  }

  function renderCurrentDeck() {
    var cfg = JSON.parse(localStorage.getItem('flashcard_config') || 'null');
    var box = document.getElementById('currentDeckBox');
    if (cfg) {
      box.innerHTML = '<div class="current-deck">' + t('currentlyLoaded') +
        ' <strong>' + cfg.flag + ' ' + cfg.label + '</strong>' +
        '<a href="flashcards.html">' + t('continuePlaying') + '</a></div>';
    } else {
      box.innerHTML = '';
    }
  }

  // Initial render
  applyUiLang();
  fetchCount('fr');
  fetchCount('nl');

  window.loadDeck = async function(lang) {
    var status = document.getElementById('status');
    var btn = document.getElementById('btn-' + lang);
    if (btn) btn.disabled = true;
    status.textContent = '';
    status.className = 'status';

    status.textContent = t('loading');

    try {
      var resp = await fetch('data/' + lang + '.json');
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var data = await resp.json();
      localStorage.setItem('flashcard_deck', JSON.stringify(data.cards));
      localStorage.setItem('flashcard_config', JSON.stringify(data.config));
      window.location.href = 'flashcards.html';
    } catch (e) {
      status.textContent = t('errorMsg');
      status.className = 'status error';
      if (btn) btn.disabled = false;
    }
  };
})();
</script>
</body>
</html>
