<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flashcard Trainer</title>
<style>
:root {
  --bg: #FFF8F0;
  --card-back: #3A5A8C;
  --accent1: #FF6B6B;
  --accent2: #FFD166;
  --accent3: #06D6A0;
  --accent4: #118AB2;
  --shadow: 0 8px 32px rgba(58,90,140,0.18);
  --radius: 24px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 16px;
  text-align: center;
}
h1 { font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--card-back); margin-bottom: 8px; }
h1 span { color: var(--accent1); }
.subtitle { color: #6B7C93; font-size: 1rem; margin-bottom: 40px; }

/* Lesson cards */
.lesson-grid {
  display: flex; flex-direction: column; gap: 14px;
  width: 100%; max-width: 460px;
}
.lesson-card {
  display: flex; align-items: center; gap: 16px;
  padding: 20px 24px;
  background: white; border: 3px solid rgba(58,90,140,0.1);
  border-radius: var(--radius); box-shadow: var(--shadow);
  cursor: pointer; font-family: inherit; text-align: left;
  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.lesson-card:hover { transform: translateY(-2px); box-shadow: 0 14px 40px rgba(58,90,140,0.22); border-color: var(--card-back); }
.lesson-card:active { transform: translateY(0); }
.lesson-topic { font-size: 1.15rem; font-weight: 800; color: var(--card-back); }
.lesson-meta { font-size: 0.78rem; color: #B0BFCF; font-weight: 600; margin-top: 3px; }
.lesson-flags { font-size: 1.4rem; margin-left: auto; letter-spacing: 2px; white-space: nowrap; }

/* Direction picker */
.step2-top { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
.btn-back {
  padding: 8px 16px; border-radius: 40px;
  border: 2px solid rgba(58,90,140,0.2); background: white;
  font-family: inherit; font-size: 0.88rem; font-weight: 700;
  color: var(--card-back); cursor: pointer;
}
.btn-back:hover { border-color: var(--card-back); }
.lesson-badge {
  font-size: 1rem; font-weight: 800; color: var(--card-back);
  background: white; border-radius: 50px; padding: 7px 16px;
  box-shadow: 0 2px 8px rgba(58,90,140,0.08);
}
.dir-grid {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 12px; width: 100%; max-width: 460px;
}
.dir-btn {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: 20px 16px;
  background: white; border: 3px solid rgba(58,90,140,0.1);
  border-radius: 18px; box-shadow: var(--shadow);
  cursor: pointer; font-family: inherit;
  transition: transform 0.15s, border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.dir-btn:hover { transform: translateY(-2px); border-color: var(--card-back); }
.dir-btn:active { transform: translateY(0); }
.dir-flags { font-size: 1.6rem; }
.dir-arrow { font-size: 0.9rem; color: #B0BFCF; }
.dir-count { font-size: 0.72rem; color: #B0BFCF; font-weight: 600; }

/* Continue playing */
.current-deck {
  margin-top: 24px; background: white;
  border: 2px solid rgba(58,90,140,0.12); border-radius: 14px;
  padding: 14px 22px; font-size: 0.88rem; color: #6B7C93; max-width: 420px;
}
.current-deck strong { color: var(--card-back); }
.current-deck a { color: var(--accent4); font-weight: 700; text-decoration: none; margin-left: 6px; }
.current-deck a:hover { text-decoration: underline; }

.status { margin-top: 20px; font-size: 0.9rem; color: #6B7C93; min-height: 22px; }
.status.error { color: var(--accent1); font-weight: 600; }

.ui-lang-select {
  position: fixed; top: 14px; right: 14px; padding: 5px 10px;
  border-radius: 20px; border: 1.5px solid rgba(58,90,140,0.2);
  background: white; font-family: inherit; font-size: 0.8rem; font-weight: 700;
  color: var(--card-back); cursor: pointer; outline: none;
  box-shadow: 0 2px 8px rgba(58,90,140,0.08);
}
</style>
</head>
<body>

<select class="ui-lang-select" id="uiLangSelect">
  <option value="en">🇬🇧 EN</option>
  <option value="fr">🇫🇷 FR</option>
  <option value="nl">🇳🇱 NL</option>
</select>

<h1>🎴 Flashcard <span>Trainer</span></h1>
<p class="subtitle" id="subtitle">Loading…</p>

<!-- Step 1: lesson list -->
<div id="step1" style="display:none">
  <div class="lesson-grid" id="lessonGrid"></div>
</div>

<!-- Step 2: direction picker -->
<div id="step2" style="display:none">
  <div class="step2-top">
    <button class="btn-back" id="backBtn">← Back</button>
    <div class="lesson-badge" id="lessonBadge"></div>
  </div>
  <div class="dir-grid" id="dirGrid"></div>
</div>

<div class="status" id="status"></div>
<div id="currentDeckBox"></div>

<script>
(function() {
  'use strict';

  var UI = {
    en: { title: 'Flashcard Trainer', step1: 'Choose a lesson:', step2: 'Choose a direction:',
          back: '← Back', cards: 'cards', loading: 'Loading…',
          currentlyLoaded: 'Currently loaded:', continuePlaying: '▶ Continue playing',
          error: 'Could not load — use a web server, not file://' },
    fr: { title: 'Entraîneur de Cartes', step1: 'Choisissez une leçon :', step2: 'Choisissez un sens :',
          back: '← Retour', cards: 'cartes', loading: 'Chargement…',
          currentlyLoaded: 'Actuellement chargé :', continuePlaying: '▶ Continuer à jouer',
          error: 'Impossible de charger — utilisez un serveur web, pas file://' },
    nl:  { title: 'Flitskaarten Trainer', step1: 'Kies een les:', step2: 'Kies een richting:',
          back: '← Terug', cards: 'kaarten', loading: 'Laden…',
          currentlyLoaded: 'Momenteel geladen:', continuePlaying: '▶ Doorgaan',
          error: 'Kon niet laden — gebruik een webserver, niet file://' }
  };

  var uiLang = localStorage.getItem('ui_lang') || 'en';
  function t(k) { return (UI[uiLang] || UI.en)[k] || k; }

  var sel = document.getElementById('uiLangSelect');
  sel.value = uiLang;
  sel.onchange = function() {
    uiLang = this.value;
    localStorage.setItem('ui_lang', uiLang);
    applyUiLang();
  };

  function applyUiLang() {
    document.title = t('title');
    document.getElementById('backBtn').textContent = t('back');
    renderCurrentDeck();
    if (document.getElementById('step1').style.display !== 'none') showStep1();
    else if (currentEntry) showStep2(currentEntry, currentFile);
  }

  var manifest = null;
  var loadedFiles = {};
  var currentEntry = null;
  var currentFile = null;

  document.getElementById('status').textContent = t('loading');

  fetch('data/manifest.json')
    .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
    .then(function(data) {
      manifest = data;
      document.getElementById('status').textContent = '';
      applyUiLang();
      showStep1();
    })
    .catch(function() {
      document.getElementById('status').textContent = t('error');
      document.getElementById('status').className = 'status error';
    });

  function topicLabel(entry) {
    return (entry.topic && (entry.topic[uiLang] || entry.topic.en)) || entry.file;
  }

  function showStep1() {
    document.getElementById('step1').style.display = '';
    document.getElementById('step2').style.display = 'none';
    document.getElementById('subtitle').textContent = t('step1');

    var grid = document.getElementById('lessonGrid');
    grid.innerHTML = '';
    manifest.forEach(function(entry) {
      var flags = entry.languages.map(function(l) {
        return { fr:'🇫🇷', nl:'🇳🇱', en:'🇬🇧' }[l] || '🏳️';
      }).join(' ');

      var card = document.createElement('button');
      card.className = 'lesson-card';
      card.innerHTML =
        '<div>' +
          '<div class="lesson-topic">' + topicLabel(entry) + '</div>' +
          '<div class="lesson-meta" id="meta-' + entry.file + '">' + t('loading') + '</div>' +
        '</div>' +
        '<div class="lesson-flags">' + flags + '</div>';
      card.onclick = function() { selectLesson(entry); };
      grid.appendChild(card);

      // Fetch card count lazily
      fetchFile(entry.file).then(function(file) {
        var el = document.getElementById('meta-' + entry.file);
        if (el) el.textContent = file.cards.length + ' ' + t('cards');
      }).catch(function() {
        var el = document.getElementById('meta-' + entry.file);
        if (el) el.textContent = '';
      });
    });

    renderCurrentDeck();
  }

  function selectLesson(entry) {
    currentEntry = entry;
    document.getElementById('status').textContent = t('loading');
    fetchFile(entry.file)
      .then(function(file) {
        currentFile = file;
        document.getElementById('status').textContent = '';
        showStep2(entry, file);
      })
      .catch(function() {
        document.getElementById('status').textContent = t('error');
        document.getElementById('status').className = 'status error';
      });
  }

  function showStep2(entry, file) {
    document.getElementById('step1').style.display = 'none';
    document.getElementById('step2').style.display = '';
    document.getElementById('subtitle').textContent = t('step2');
    document.getElementById('lessonBadge').textContent = topicLabel(entry);

    var langs = Object.keys(file.languages || {});
    var grid = document.getElementById('dirGrid');
    grid.innerHTML = '';

    // Generate all ordered pairs
    langs.forEach(function(src) {
      langs.forEach(function(tgt) {
        if (src === tgt) return;
        var count = file.cards.filter(function(c) { return c[src] && c[tgt]; }).length;
        if (count === 0) return;

        var srcMeta = file.languages[src];
        var tgtMeta = file.languages[tgt];
        var btn = document.createElement('button');
        btn.className = 'dir-btn';
        btn.innerHTML =
          '<div class="dir-flags">' + srcMeta.flag + '</div>' +
          '<div class="dir-arrow">↓</div>' +
          '<div class="dir-flags">' + tgtMeta.flag + '</div>' +
          '<div class="dir-count">' + count + ' ' + t('cards') + '</div>';
        btn.onclick = function() { startSession(entry, file, src, tgt); };
        grid.appendChild(btn);
      });
    });
  }

  function startSession(entry, file, sourceLang, targetLang) {
    var cards = file.cards.filter(function(c) { return c[sourceLang] && c[targetLang]; });
    var config = {
      sourceLang: sourceLang,
      targetLang: targetLang,
      source: file.languages[sourceLang],
      target: file.languages[targetLang],
      topic: entry.topic || {}
    };
    localStorage.setItem('flashcard_config', JSON.stringify(config));
    localStorage.setItem('flashcard_deck', JSON.stringify(cards));
    window.location.href = 'flashcards.html';
  }

  function fetchFile(filename) {
    if (loadedFiles[filename]) return Promise.resolve(loadedFiles[filename]);
    return fetch('data/' + filename)
      .then(function(r) { if (!r.ok) throw new Error(); return r.json(); })
      .then(function(d) { loadedFiles[filename] = d; return d; });
  }

  function renderCurrentDeck() {
    var cfg = JSON.parse(localStorage.getItem('flashcard_config') || 'null');
    var box = document.getElementById('currentDeckBox');
    if (cfg && cfg.source && cfg.target) {
      var topic = (cfg.topic && (cfg.topic[uiLang] || cfg.topic.en)) || '';
      box.innerHTML =
        '<div class="current-deck">' + t('currentlyLoaded') +
        ' <strong>' + (topic ? topic + ' · ' : '') +
        cfg.source.flag + ' → ' + cfg.target.flag + '</strong>' +
        '<a href="flashcards.html">' + t('continuePlaying') + '</a></div>';
    } else {
      box.innerHTML = '';
    }
  }

  document.getElementById('backBtn').onclick = function() {
    currentEntry = null; currentFile = null;
    showStep1();
  };
})();
</script>
</body>
</html>
