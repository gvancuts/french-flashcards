<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Flashcard Trainer</title>
<style>
:root {
  --bg: #FFF8F0;
  --card-back: #3A5A8C;
  --accent1: #FF6B6B;
  --accent2: #FFD166;
  --accent3: #06D6A0;
  --accent4: #118AB2;
  --text-dark: #2D2D2D;
  --shadow: 0 8px 32px rgba(58, 90, 140, 0.18);
  --radius: 24px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 60px;
}
header { text-align: center; margin-bottom: 28px; }
.flag { font-size: 2.2rem; display: block; margin-bottom: 8px; }
h1 { font-weight: 800; font-size: clamp(1.8rem, 5vw, 2.6rem); color: var(--card-back); line-height: 1.1; }
h1 span { color: var(--accent1); }
.subtitle { font-size: 0.95rem; color: #7A8BA0; margin-top: 4px; font-weight: 600; }

.top-controls { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
.pill-btn { padding: 7px 16px; border-radius: 40px; border: 2px solid rgba(58,90,140,0.2); font-weight: 700; font-size: 0.85rem; cursor: pointer; background: transparent; color: #7A8BA0; }
.pill-btn.active { background: var(--accent2); border-color: var(--accent2); color: var(--text-dark); }

.progress-bar { width: 100%; max-width: 480px; height: 8px; background: rgba(58,90,140,0.15); border-radius: 10px; margin-bottom: 10px; }
.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent3), var(--accent4)); border-radius: 10px; transition: width 0.4s ease; }
.progress-text { font-size: 0.82rem; color: #7A8BA0; font-weight: 700; margin-bottom: 20px; }

.review-banner { width: 100%; max-width: 420px; background: linear-gradient(135deg, var(--accent1), #E74C3C); color: white; border-radius: 16px; padding: 12px 20px; margin-bottom: 16px; text-align: center; font-weight: 700; font-size: 0.95rem; display: none; gap: 8px; }
.review-banner.show { display: flex; align-items: center; justify-content: center; }
.review-banner button { background: rgba(255,255,255,0.25); border: none; color: white; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.8rem; cursor: pointer; }

.card-area { width: 100%; max-width: 420px; min-height: 220px; margin-bottom: 24px; background: white; border-radius: var(--radius); padding: 28px; box-shadow: var(--shadow); border: 3px solid rgba(58,90,140,0.1); display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
.card-label { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #B0BFCF; margin-bottom: 14px; }
.card-word { font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.8rem); color: var(--card-back); text-align: center; line-height: 1.1; }
.card-hint { font-size: 0.78rem; color: #C5D0DC; margin-top: 16px; font-weight: 600; }
.card-example { font-size: 0.85rem; color: #7A8BA0; margin-top: 12px; font-style: italic; text-align: center; line-height: 1.4; max-width: 100%; }

.result-overlay { position: absolute; inset: 0; border-radius: calc(var(--radius) - 3px); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
.result-overlay.show { opacity: 1; pointer-events: auto; }
.result-overlay.correct-overlay { background: rgba(6,214,160,0.95); }
.result-overlay.wrong-overlay { background: rgba(255,107,107,0.95); }
.result-icon { font-size: 2.2rem; margin-bottom: 6px; }
.result-msg { font-weight: 800; font-size: 1.3rem; color: white; text-align: center; }
.result-answer { font-size: 0.9rem; color: rgba(255,255,255,0.9); margin-top: 6px; font-weight: 700; text-align: center; }
.result-example { font-size: 0.8rem; color: rgba(255,255,255,0.85); margin-top: 8px; font-style: italic; text-align: center; line-height: 1.3; }

.type-area { width: 100%; max-width: 420px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
.input-row { display: flex; gap: 10px; }
.answer-input { flex: 1; padding: 14px 20px; border-radius: 50px; border: 2.5px solid rgba(58,90,140,0.2); background: white; font-size: 1.1rem; font-weight: 600; color: var(--text-dark); outline: none; }
.answer-input:focus { border-color: var(--card-back); }
.answer-input.correct-input { border-color: var(--accent3); background: rgba(6,214,160,0.07); }
.answer-input.wrong-input { border-color: var(--accent1); background: rgba(255,107,107,0.07); }
.answer-input:disabled { opacity: 0.7; }

.btn-check { padding: 14px 22px; border-radius: 50px; border: none; background: var(--card-back); color: white; font-weight: 700; font-size: 1rem; cursor: pointer; white-space: nowrap; -webkit-appearance: none; -webkit-tap-highlight-color: transparent; }
.btn-check:disabled { opacity: 0.4; }

.accent-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; min-height: 16px; }
.accent-btn { padding: 5px 11px; border-radius: 20px; border: 1.5px solid rgba(58,90,140,0.2); background: white; font-size: 0.95rem; font-weight: 700; color: var(--card-back); cursor: pointer; -webkit-tap-highlight-color: transparent; }

.feedback-strip { width: 100%; max-width: 420px; border-radius: 16px; padding: 12px 20px; margin-bottom: 14px; text-align: center; font-weight: 700; font-size: 1rem; opacity: 0; transition: opacity 0.3s; }
.feedback-strip.show { opacity: 1; }
.feedback-strip.correct-strip { background: rgba(6,214,160,0.15); color: #028A6A; }
.feedback-strip.wrong-strip { background: rgba(255,107,107,0.15); color: #C0392B; }

.btn-next { padding: 13px 32px; background: var(--accent3); color: white; border: none; border-radius: 50px; font-weight: 700; font-size: 1rem; cursor: pointer; margin-bottom: 20px; display: none; -webkit-tap-highlight-color: transparent; }
.btn-next.show { display: block; }

.btn-skip { padding: 11px 24px; background: rgba(58,90,140,0.1); color: var(--card-back); border: 2px solid rgba(58,90,140,0.2); border-radius: 50px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-bottom: 20px; -webkit-tap-highlight-color: transparent; transition: all 0.2s; }
.btn-skip:hover { background: rgba(58,90,140,0.15); }

.stats { display: flex; gap: 20px; background: white; border-radius: 20px; padding: 14px 28px; margin-bottom: 20px; }
.stat { text-align: center; }
.stat-num { font-size: 1.5rem; font-weight: 800; line-height: 1; }
.stat-num.green { color: var(--accent3); }
.stat-num.red { color: var(--accent1); }
.stat-num.blue { color: var(--accent4); }
.stat-label { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #B0BFCF; margin-top: 2px; }
.stat-divider { width: 1px; background: rgba(0,0,0,0.08); }

.bottom-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.btn-shuffle { padding: 10px 22px; background: rgba(58,90,140,0.08); color: var(--card-back); border-radius: 50px; border: none; font-weight: 700; font-size: 0.88rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-review { padding: 10px 22px; background: var(--accent1); color: white; border-radius: 50px; border: none; font-weight: 700; font-size: 0.88rem; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.btn-review:disabled { opacity: 0.4; }

.ui-lang-select {
  position: fixed; top: 14px; right: 14px; padding: 5px 10px;
  border-radius: 20px; border: 1.5px solid rgba(58,90,140,0.2);
  background: white; font-family: inherit; font-size: 0.8rem; font-weight: 700;
  color: var(--card-back); cursor: pointer; outline: none;
  box-shadow: 0 2px 8px rgba(58,90,140,0.08);
}
.ui-lang-select:focus { border-color: var(--card-back); }
</style>
</head>
<body>

<select class="ui-lang-select" id="uiLangSelect">
  <option value="en">🇬🇧 EN</option>
  <option value="fr">🇫🇷 FR</option>
  <option value="nl">🇳🇱 NL</option>
</select>

<header>
  <span class="flag" id="langFlag">🎴</span>
  <h1 id="appHeadline">Flashcard <span>Trainer</span></h1>
</header>

<div class="top-controls">
  <button class="pill-btn active" id="mode-forward">→</button>
  <button class="pill-btn" id="mode-reverse">←</button>
  <a id="switchLink" href="index.html" style="font-size:0.78rem;font-weight:600;color:#B0BFCF;text-decoration:none;padding:8px 14px;border-radius:50px;background:rgba(58,90,140,0.07);">⇄ Switch</a>
</div>

<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
<div class="progress-text" id="progressText">Card 1 of …</div>

<div class="review-banner" id="reviewBanner">
  🔁 Reviewing missed words only
  <button id="exitReviewBtn">Exit Review</button>
</div>

<div class="card-area">
  <div class="card-label" id="frontLabel">…</div>
  <div class="card-word" id="frontWord"></div>
  <div class="card-example" id="cardExample"></div>
  <div class="card-hint" id="cardHint">✏️ Type your answer below</div>
  <div class="result-overlay" id="resultOverlay">
    <div class="result-icon" id="resultIcon">✓</div>
    <div class="result-msg" id="resultMsg">Correct!</div>
    <div class="result-answer" id="resultAnswer"></div>
    <div class="result-example" id="resultExample"></div>
  </div>
</div>

<div class="type-area">
  <div class="input-row">
    <input type="text" class="answer-input" id="answerInput" placeholder="Type your answer…" autocomplete="off" autocorrect="off" spellcheck="false" />
    <button class="btn-check" id="checkBtn">Check ↵</button>
  </div>
  <div class="accent-bar" id="accentBar"></div>
</div>

<div class="feedback-strip" id="feedbackStrip"></div>
<button class="btn-next" id="nextBtn">Next card →</button>
<button class="btn-skip" id="skipBtn">Skip →</button>

<div class="stats">
  <div class="stat"><div class="stat-num green" id="statCorrect">0</div><div class="stat-label" id="statLabelCorrect">Correct</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num red" id="statIncorrect">0</div><div class="stat-label" id="statLabelLearning">Learning</div></div>
  <div class="stat-divider"></div>
  <div class="stat"><div class="stat-num blue" id="statRemaining">0</div><div class="stat-label" id="statLabelRemaining">Remaining</div></div>
</div>

<div class="bottom-actions">
  <button class="btn-shuffle" id="shuffleBtn">🔀 Shuffle Cards</button>
  <button class="btn-review" id="reviewBtn" disabled>📖 Review Missed</button>
  <button class="btn-review" id="reviewSkippedBtn" disabled>⏭️ Review Skipped</button>
</div>

<script>
(function() {
  'use strict';

  // --- Load config from localStorage ---
  const _cfg = JSON.parse(localStorage.getItem('flashcard_config') || 'null') || {};
  const _savedDeck = JSON.parse(localStorage.getItem('flashcard_deck') || 'null');

  if (!_savedDeck) {
    window.location.replace('index.html');
    return;
  }

  // --- i18n ---
  var UI_STRINGS = {
    en: {
      tabAll: '🃏 All Words',
      switchBtn: '⇄ Switch',
      cardHint: '✏️ Type your answer below',
      placeholder: 'Type your answer\u2026',
      checkBtn: 'Check \u21b5',
      nextBtn: 'Next card \u2192',
      skipBtn: 'Skip \u2192',
      shuffleBtn: '\uD83D\uDD00 Shuffle Cards',
      reviewMissedBtn: '\uD83D\uDCD6 Review Missed',
      reviewSkippedBtn: '\u23ED\uFE0F Review Skipped',
      statCorrect: 'Correct', statLearning: 'Learning', statRemaining: 'Remaining',
      reviewingMissed: '\uD83D\uDD01 Reviewing missed words only',
      reviewingSkipped: '\uD83D\uDD01 Reviewing skipped words only',
      exitReview: 'Exit Review',
      cardOf: 'Card', of: 'of',
      correct: 'Correct! \uD83C\uDF89', notQuite: 'Not quite\u2026',
      answerLabel: 'Answer:', theAnswerWas: 'The answer was:',
      deckComplete: '\uD83C\uDF89 Deck complete! {c}/{t} correct. Shuffle to go again!'
    },
    fr: {
      tabAll: '🃏 Tous les mots',
      switchBtn: '⇄ Changer',
      cardHint: '✏️ Tapez votre réponse ci-dessous',
      placeholder: 'Tapez votre réponse\u2026',
      checkBtn: 'Vérifier \u21b5',
      nextBtn: 'Carte suivante \u2192',
      skipBtn: 'Passer \u2192',
      shuffleBtn: '\uD83D\uDD00 Mélanger',
      reviewMissedBtn: '\uD83D\uDCD6 Revoir les erreurs',
      reviewSkippedBtn: '\u23ED\uFE0F Revoir les passées',
      statCorrect: 'Correct', statLearning: 'En cours', statRemaining: 'Restant',
      reviewingMissed: '\uD83D\uDD01 Révision des mots manqués',
      reviewingSkipped: '\uD83D\uDD01 Révision des mots passés',
      exitReview: 'Quitter',
      cardOf: 'Carte', of: 'sur',
      correct: 'Correct\u00a0! \uD83C\uDF89', notQuite: 'Pas tout à fait\u2026',
      answerLabel: 'Réponse\u00a0:', theAnswerWas: 'La réponse était\u00a0:',
      deckComplete: '\uD83C\uDF89 Deck terminé\u00a0! {c}/{t} correct. Mélangez pour recommencer\u00a0!'
    },
    nl: {
      tabAll: '🃏 Alle woorden',
      switchBtn: '⇄ Wissel',
      cardHint: '✏️ Typ uw antwoord hieronder',
      placeholder: 'Typ uw antwoord\u2026',
      checkBtn: 'Controleer \u21b5',
      nextBtn: 'Volgende kaart \u2192',
      skipBtn: 'Overslaan \u2192',
      shuffleBtn: '\uD83D\uDD00 Schudden',
      reviewMissedBtn: '\uD83D\uDCD6 Fouten herhalen',
      reviewSkippedBtn: '\u23ED\uFE0F Overgeslagen herhalen',
      statCorrect: 'Goed', statLearning: 'Leren', statRemaining: 'Resterend',
      reviewingMissed: '\uD83D\uDD01 Gemiste woorden herhalen',
      reviewingSkipped: '\uD83D\uDD01 Overgeslagen woorden herhalen',
      exitReview: 'Stoppen',
      cardOf: 'Kaart', of: 'van',
      correct: 'Goed! \uD83C\uDF89', notQuite: 'Niet helemaal\u2026',
      answerLabel: 'Antwoord:', theAnswerWas: 'Het antwoord was:',
      deckComplete: '\uD83C\uDF89 Deck klaar! {c}/{t} goed. Schud om opnieuw te beginnen!'
    }
  };

  var uiLang = localStorage.getItem('ui_lang') || 'en';

  function t(key) {
    return (UI_STRINGS[uiLang] || UI_STRINGS.en)[key] || key;
  }

  function applyUiLang() {
    document.getElementById('tab-all').textContent = t('tabAll');
    document.getElementById('switchLink').textContent = t('switchBtn');
    document.getElementById('cardHint').textContent = t('cardHint');
    document.getElementById('answerInput').placeholder = t('placeholder');
    document.getElementById('checkBtn').textContent = t('checkBtn');
    document.getElementById('nextBtn').textContent = t('nextBtn');
    document.getElementById('skipBtn').textContent = t('skipBtn');
    document.getElementById('shuffleBtn').textContent = t('shuffleBtn');
    document.getElementById('reviewBtn').textContent = t('reviewMissedBtn');
    document.getElementById('reviewSkippedBtn').textContent = t('reviewSkippedBtn');
    document.getElementById('statLabelCorrect').textContent = t('statCorrect');
    document.getElementById('statLabelLearning').textContent = t('statLearning');
    document.getElementById('statLabelRemaining').textContent = t('statRemaining');
    document.getElementById('progressText').textContent =
      t('cardOf') + ' ' + (current + 1) + ' ' + t('of') + ' ' + cards.length;
    var banner = document.getElementById('reviewBanner');
    if (banner.classList.contains('show')) {
      renderReviewBanner(banner.dataset.reviewType || 'missed');
    }
  }

  function renderReviewBanner(type) {
    var banner = document.getElementById('reviewBanner');
    banner.dataset.reviewType = type;
    banner.innerHTML = t(type === 'skipped' ? 'reviewingSkipped' : 'reviewingMissed') +
      ' <button id="exitReviewBtn">' + t('exitReview') + '</button>';
    document.getElementById('exitReviewBtn').onclick = exitReview;
  }

  var uiLangSel = document.getElementById('uiLangSelect');
  uiLangSel.value = uiLang;
  uiLangSel.onchange = function() {
    uiLang = this.value;
    localStorage.setItem('ui_lang', uiLang);
    applyUiLang();
  };

  // --- Deck / language config ---
  const SOURCE_LANG = _cfg.sourceLang || 'fr';
  const TARGET_LANG = _cfg.targetLang || 'en';
  const SOURCE_META = _cfg.source || { label: 'French', flag: '🇫🇷', accents: [], articleRegex: null };
  const TARGET_META = _cfg.target || { label: 'English', flag: '🇬🇧', accents: [], articleRegex: null };
  const SOURCE_ARTICLE_RE = SOURCE_META.articleRegex ? new RegExp(SOURCE_META.articleRegex, 'i') : null;
  const TARGET_ARTICLE_RE = TARGET_META.articleRegex ? new RegExp(TARGET_META.articleRegex, 'i') : null;

  const allCards = _savedDeck;
  let cards = allCards.slice();
  let current = 0;
  let mode = 'forward'; // 'forward': show source, type target | 'reverse': show target, type source
  let scores = {};
  let answered = false;
  let reviewMode = false;
  let originalCards = [];
  let skippedCards = {};

  function normalise(s) {
    return s.trim().toLowerCase().replace(/['']/g, "'").replace(/\s+/g, ' ');
  }

  function stripAccents(s) {
    return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function isCorrect(userInput, target) {
    const u = normalise(userInput);
    let tgt = normalise(target).replace(/\s*\([^)]*\)/g, '');

    if (u === tgt) return true;

    // Accept any one value from a comma-separated list
    if (tgt.includes(',')) {
      const opts = tgt.split(',').map(function(o) { return o.trim(); });
      for (var i = 0; i < opts.length; i++) {
        if (u === opts[i]) return true;
      }
    }
    if (u.includes(',')) {
      const userOpts = u.split(',').map(function(o) { return o.trim(); });
      const tgtOpts = tgt.split(',').map(function(o) { return o.trim(); });
      var allValid = userOpts.length > 0;
      for (var i = 0; i < userOpts.length; i++) {
        if (tgtOpts.indexOf(userOpts[i]) < 0) { allValid = false; break; }
      }
      if (allValid) return true;
    }

    // Accent-insensitive match
    if (stripAccents(u) === stripAccents(tgt)) return true;

    // Strip articles based on which language the user is typing
    var articleRe = (mode === 'forward') ? TARGET_ARTICLE_RE : SOURCE_ARTICLE_RE;
    if (articleRe) {
      const noArticle = normalise(tgt.replace(articleRe, ''));
      if (u === noArticle || stripAccents(u) === stripAccents(noArticle)) return true;
    }

    return false;
  }

  function renderCard() {
    const card = cards[current];
    if (!card) return;
    answered = false;

    const showLang = (mode === 'forward') ? SOURCE_LANG : TARGET_LANG;
    const showMeta = (mode === 'forward') ? SOURCE_META : TARGET_META;

    document.getElementById('frontLabel').textContent = showMeta.label.toUpperCase();
    document.getElementById('frontWord').textContent = card[showLang] || '';

    // Show example in the display language (doesn't reveal the answer)
    const exKey = 'example_' + showLang;
    const exampleEl = document.getElementById('cardExample');
    if (card[exKey]) {
      exampleEl.textContent = card[exKey];
      exampleEl.style.display = 'block';
    } else {
      exampleEl.textContent = '';
      exampleEl.style.display = 'none';
    }

    const input = document.getElementById('answerInput');
    input.value = '';
    input.disabled = false;
    input.className = 'answer-input';
    document.getElementById('checkBtn').disabled = false;
    document.getElementById('resultOverlay').className = 'result-overlay';
    document.getElementById('feedbackStrip').className = 'feedback-strip';
    document.getElementById('nextBtn').classList.remove('show');

    renderAccentBar();

    const pct = ((current + 1) / cards.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent =
      t('cardOf') + ' ' + (current + 1) + ' ' + t('of') + ' ' + cards.length;

    setTimeout(function() { document.getElementById('answerInput').focus(); }, 100);
  }

  function renderAccentBar() {
    const bar = document.getElementById('accentBar');
    const typeMeta = (mode === 'forward') ? TARGET_META : SOURCE_META;
    const accents = typeMeta.accents || [];
    if (accents.length === 0) { bar.innerHTML = ''; return; }
    bar.innerHTML = accents.map(function(a) {
      return '<button class="accent-btn" data-char="' + a + '">' + a + '</button>';
    }).join('');
    var btns = bar.querySelectorAll('.accent-btn');
    for (var i = 0; i < btns.length; i++) {
      btns[i].onclick = function() { insertAccent(this.getAttribute('data-char')); };
    }
  }

  function insertAccent(char) {
    const input = document.getElementById('answerInput');
    if (input.disabled) return;
    const s = input.selectionStart, e = input.selectionEnd;
    input.value = input.value.slice(0, s) + char + input.value.slice(e);
    input.selectionStart = input.selectionEnd = s + 1;
    input.focus();
  }

  function checkAnswer() {
    if (answered) { nextCard(); return; }

    const card = cards[current];
    const input = document.getElementById('answerInput');
    const userValue = input.value;
    if (!userValue.trim()) return;

    const typeLang = (mode === 'forward') ? TARGET_LANG : SOURCE_LANG;
    const target = card[typeLang] || '';
    const correct = isCorrect(userValue, target);

    answered = true;
    input.disabled = true;
    document.getElementById('checkBtn').disabled = true;
    delete skippedCards[current];

    const overlay = document.getElementById('resultOverlay');
    const fb = document.getElementById('feedbackStrip');
    const resultExEl = document.getElementById('resultExample');

    if (correct) {
      input.classList.add('correct-input');
      overlay.className = 'result-overlay correct-overlay show';
      document.getElementById('resultIcon').textContent = '✓';
      document.getElementById('resultMsg').textContent = t('correct');
      document.getElementById('resultAnswer').textContent = target;
      fb.textContent = '✓  "' + target + '"';
      fb.className = 'feedback-strip correct-strip show';
      scores[current] = true;
    } else {
      input.classList.add('wrong-input');
      overlay.className = 'result-overlay wrong-overlay show';
      document.getElementById('resultIcon').textContent = '✗';
      document.getElementById('resultMsg').textContent = t('notQuite');
      document.getElementById('resultAnswer').textContent = t('answerLabel') + ' ' + target;
      fb.textContent = '✗  ' + t('theAnswerWas') + ' "' + target + '"';
      fb.className = 'feedback-strip wrong-strip show';
      scores[current] = false;
    }

    // Show result-side example (the answer language's example)
    const resultLang = (mode === 'forward') ? TARGET_LANG : SOURCE_LANG;
    const exResultKey = 'example_' + resultLang;
    if (card[exResultKey]) {
      resultExEl.textContent = card[exResultKey];
      resultExEl.style.display = 'block';
    } else {
      resultExEl.textContent = '';
      resultExEl.style.display = 'none';
    }

    updateStats();
    document.getElementById('nextBtn').classList.add('show');
  }

  function nextCard() {
    if (current < cards.length - 1) {
      current++;
      renderCard();
    } else {
      const correct = Object.keys(scores).filter(function(k) { return scores[k] === true; }).length;
      const fb = document.getElementById('feedbackStrip');
      fb.textContent = t('deckComplete').replace('{c}', correct).replace('{t}', cards.length);
      fb.className = 'feedback-strip correct-strip show';
      document.getElementById('nextBtn').classList.remove('show');
    }
  }

  function skipCard() {
    skippedCards[current] = true;
    if (current < cards.length - 1) { current++; renderCard(); }
    updateStats();
  }

  function updateStats() {
    var correct   = Object.keys(scores).filter(function(k) { return scores[k] === true; }).length;
    var incorrect = Object.keys(scores).filter(function(k) { return scores[k] === false; }).length;
    var skipped   = Object.keys(skippedCards).length;
    var remaining = Math.max(0, cards.length - Object.keys(scores).length - skipped);
    document.getElementById('statCorrect').textContent = correct;
    document.getElementById('statIncorrect').textContent = incorrect;
    document.getElementById('statRemaining').textContent = remaining;
    document.getElementById('reviewBtn').disabled = incorrect === 0;
    document.getElementById('reviewSkippedBtn').disabled = skipped === 0;
  }

  function setMode(m) {
    mode = m;
    document.getElementById('mode-forward').classList.toggle('active', m === 'forward');
    document.getElementById('mode-reverse').classList.toggle('active', m === 'reverse');
    scores = {}; skippedCards = {}; current = 0; reviewMode = false;
    document.getElementById('reviewBanner').classList.remove('show');
    renderCard(); updateStats();
  }

  function shuffleCards() {
    if (reviewMode) {
      cards = originalCards.slice(); reviewMode = false; originalCards = [];
      document.getElementById('reviewBanner').classList.remove('show');
    }
    for (var i = cards.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = cards[i]; cards[i] = cards[j]; cards[j] = tmp;
    }
    scores = {}; skippedCards = {}; current = 0;
    renderCard(); updateStats();
  }

  function reviewMissed() {
    var missed = Object.keys(scores).filter(function(k) { return scores[k] === false; }).map(Number);
    if (missed.length === 0) return;
    originalCards = cards.slice(); reviewMode = true;
    cards = missed.map(function(i) { return originalCards[i]; });
    scores = {}; current = 0;
    renderReviewBanner('missed');
    document.getElementById('reviewBanner').classList.add('show');
    renderCard(); updateStats();
  }

  function reviewSkipped() {
    var skipped = Object.keys(skippedCards).filter(function(k) { return skippedCards[k]; }).map(Number);
    if (skipped.length === 0) return;
    originalCards = cards.slice(); reviewMode = true;
    cards = skipped.map(function(i) { return originalCards[i]; });
    skippedCards = {}; scores = {}; current = 0;
    document.getElementById('reviewBanner').classList.add('show');
    renderReviewBanner('skipped');
    renderCard(); updateStats();
  }

  function exitReview() {
    if (!reviewMode) return;
    cards = originalCards.slice(); reviewMode = false; originalCards = []; current = 0;
    document.getElementById('reviewBanner').classList.remove('show');
    renderCard(); updateStats();
  }

  // --- Event handlers ---
  document.getElementById('checkBtn').onclick = function(e) { e.preventDefault(); checkAnswer(); return false; };
  document.getElementById('nextBtn').onclick = function(e) { e.preventDefault(); nextCard(); return false; };
  document.getElementById('skipBtn').onclick = function(e) { e.preventDefault(); skipCard(); return false; };
  document.getElementById('shuffleBtn').onclick = function(e) { e.preventDefault(); shuffleCards(); return false; };
  document.getElementById('reviewBtn').onclick = function(e) { e.preventDefault(); reviewMissed(); return false; };
  document.getElementById('reviewSkippedBtn').onclick = function(e) { e.preventDefault(); reviewSkipped(); return false; };
  document.getElementById('exitReviewBtn').onclick = function(e) { e.preventDefault(); exitReview(); return false; };

  document.getElementById('mode-forward').onclick = function() { setMode('forward'); };
  document.getElementById('mode-reverse').onclick = function() { setMode('reverse'); };

  document.getElementById('answerInput').onkeypress = function(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      answered ? nextCard() : checkAnswer();
    }
  };
  document.addEventListener('keydown', function(e) {
    if ((e.key === 'Enter' || e.keyCode === 13) && answered &&
        document.getElementById('nextBtn').classList.contains('show')) {
      e.preventDefault(); nextCard();
    }
  });

  // --- Apply config to UI ---
  document.getElementById('langFlag').textContent = SOURCE_META.flag + ' → ' + TARGET_META.flag;
  document.getElementById('appHeadline').innerHTML =
    SOURCE_META.flag + ' <span>' + SOURCE_META.label + '</span> → ' +
    TARGET_META.flag + ' ' + TARGET_META.label;
  document.getElementById('mode-forward').textContent = SOURCE_META.flag + ' → ' + TARGET_META.flag;
  document.getElementById('mode-reverse').textContent = TARGET_META.flag + ' → ' + SOURCE_META.flag;
  document.title = SOURCE_META.label + ' ↔ ' + TARGET_META.label;

  // --- Init ---
  applyUiLang();
  renderCard();
  updateStats();
})();
</script>
</body>
</html>
